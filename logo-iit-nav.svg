<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" width="260" height="44">
  <rect width="260" height="44" fill="#080b10"/>
  <!-- chip mini izquierdo -->
  <rect x="4" y="8" width="28" height="28" rx="4" fill="#0d1520" stroke="#00d4ff" stroke-width="1.2"/>
  <!-- pines top -->
  <line x1="11" y1="8" x2="11" y2="3" stroke="#00d4ff" stroke-width="1"/>
  <line x1="18" y1="8" x2="18" y2="3" stroke="#00d4ff" stroke-width="1"/>
  <line x1="25" y1="8" x2="25" y2="3" stroke="#00d4ff" stroke-width="1"/>
  <!-- pines bottom -->
  <line x1="11" y1="36" x2="11" y2="41" stroke="#00d4ff" stroke-width="1"/>
  <line x1="18" y1="36" x2="18" y2="41" stroke="#00d4ff" stroke-width="1"/>
  <line x1="25" y1="36" x2="25" y2="41" stroke="#00d4ff" stroke-width="1"/>
  <!-- pines left -->
  <line x1="4" y1="16" x2="1" y2="16" stroke="#00d4ff" stroke-width="1"/>
  <line x1="4" y1="28" x2="1" y2="28" stroke="#10b981" stroke-width="1"/>
  <!-- pines right -->
  <line x1="32" y1="16" x2="35" y2="16" stroke="#00d4ff" stroke-width="1"/>
  <line x1="32" y1="28" x2="35" y2="28" stroke="#10b981" stroke-width="1"/>
  <!-- core interior -->
  <rect x="10" y="14" width="16" height="16" rx="3" fill="#061218" stroke="#00d4ff" stroke-width="1"/>
  <circle cx="18" cy="22" r="4" fill="none" stroke="#00d4ff" stroke-width="1"/>
  <circle cx="18" cy="22" r="1.5" fill="#00d4ff"/>
  <!-- separador -->
  <line x1="42" y1="8" x2="42" y2="36" stroke="#1e2d42" stroke-width="1"/>
  <!-- IIT texto -->
  <text x="52" y="30" font-family="'Space Mono','Courier New',monospace" font-size="20" font-weight="700" fill="#e2e8f0" letter-spacing="-0.5">I<tspan fill="#00d4ff">I</tspan>T</text>
  <!-- separador 2 -->
  <line x1="96" y1="8" x2="96" y2="36" stroke="#1e2d42" stroke-width="1"/>
  <!-- subtexto -->
  <text x="104" y="20" font-family="'Space Mono','Courier New',monospace" font-size="7" fill="#64748b" letter-spacing="2">INFRAESTRUCTURA</text>
  <text x="104" y="32" font-family="'Space Mono','Courier New',monospace" font-size="7" fill="#00d4ff" letter-spacing="3">IT · BOGOTÁ</text>
  <!-- punto pulsante -->
  <circle cx="248" cy="22" r="3" fill="#00d4ff" opacity="0.9"/>
</svg>
